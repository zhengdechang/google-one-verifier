name: Build Windows EXE

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build verify_one.exe
        run: |
          pyinstaller --noconfirm --clean --onefile --console --name verify_one verify_one.py

      - name: Upload verify_one.exe artifact
        uses: actions/upload-artifact@v4
        with:
          name: verify_one-windows-exe
          path: dist/verify_one.exe

      - name: Publish to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/verify_one.exe
          generate_release_notes: true
